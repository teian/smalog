[package]
name = "smalog-schema-benchmark"
version = "0.1.0"
edition = "2021"
description = "Deterministic capacity benchmark for smalog schema v1"
license = "EUPL-1.2"
rust-version = "1.85"

[[bin]]
name = "schema-v1-benchmark"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.183"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smalog-storage = { path = "../smalog-storage" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "chrono"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
