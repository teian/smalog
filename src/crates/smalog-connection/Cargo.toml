[package]
name = "smalog-connection"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Shared SMA inverter connection library for SMA Data 2 Plus and legacy SMA-Data"
license = "EUPL-1.2"

[dependencies]
async-trait = "0.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smalog-observation = { path = "../smalog-observation" }
smalog-tags = { path = "../smalog-tags" }
socket2 = "0.6.4"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["net", "time", "rt-multi-thread"] }
tracing = "0.1.44"

# Linux Bluetooth: raw AF_BLUETOOTH RFCOMM sockets.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows Bluetooth: Winsock AF_BTH RFCOMM sockets.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
] }

[dev-dependencies]
chrono-tz = "0.10.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
