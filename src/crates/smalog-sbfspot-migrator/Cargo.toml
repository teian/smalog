[package]
name = "smalog-sbfspot-migrator"
version = "0.1.0"
edition = "2021"
description = "Resumable migration from SBFspot SQLite databases into smalog schema v1"
license = "EUPL-1.2"
rust-version = "1.85"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures-util = "0.3.32"
libc = "0.2.183"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smalog-storage = { path = "../smalog-storage" }
smalog-connection = { path = "../smalog-connection" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "chrono", "migrate", "macros"] }
tokio = { version = "1.52.3", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
# The tests are async; without this the crate only compiles as part of a
# workspace build that happens to unify tokio's macros feature from a sibling.
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
