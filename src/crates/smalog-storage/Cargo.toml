[package]
name = "smalog-storage"
version = "0.1.0"
edition = "2021"
description = "Canonical schema, domain model, and database storage for smalog"
license = "EUPL-1.2"
rust-version = "1.89"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
smalog-observation = { path = "../smalog-observation" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "chrono", "migrate", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
# The integration tests are async; without this the crate only compiles as
# part of a workspace build that unifies tokio's macros feature from a sibling.
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
