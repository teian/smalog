[package]
name = "smalog-export"
version = "0.1.0"
edition = "2021"
description = "CSV, MQTT and planned export boundaries for smalog"
license = "EUPL-1.2"
repository = "https://github.com/teian/smalog"
rust-version = "1.89"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
# The maintained v4-next line: rumqttc 0.25.1 is the last release of the
# original crate and pins rustls-webpki 0.102, whose advisories are only
# fixed in 0.103. Default features are off because the client speaks plain
# TCP; enabling "use-rustls-ring" adds TLS on a patched webpki 0.103.
rumqttc-v4-next = { version = "0.34.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smalog-observation = { path = "../smalog-observation" }
smalog-tags = { path = "../smalog-tags" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
bytes = "1.11.1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread"] }
